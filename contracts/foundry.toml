# bluechip's onchain policies. Compiler settings fix the bytecode and so every CREATE2 address: they live only in
# [profile.default] and match Namera's (solc 0.8.38, via-IR, cancun, no metadata hash).
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false
ignored_warnings_from = ["dependencies"]
fs_permissions = [{ access = "read", path = "./test/vectors.json" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
ignore = ["dependencies/**"]

[lint]
severity = ["high", "medium", "low"]
# Both policies check each configured stock in a loop and must revert on the first rule it breaks, as Namera's do.
exclude_lints = ["calls-loop", "require-revert-in-loop"]
ignore = ["dependencies/**"]
lint_on_build = false

[fuzz]
runs = 1000

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
forge-std = "1.17.0"
solady = "0.1.26"
namera = { version = "2.0.0-rc.0", git = "https://github.com/thenamespace/namera-core.git", rev = "87d8a5f71c7b92d59c25892be8eb5a0fb2f65cc5" }
