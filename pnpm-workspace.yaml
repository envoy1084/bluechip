packages:
  - apps/*
  - packages/*
  - scripts

# Versions referenced by more than one package.json. A dependency only one package uses is pinned
# in that package.json instead.
catalog:
  "@namera-ai/contracts": "2.0.0-rc.0"
  "@namera-ai/sdk": "2.0.0-rc.0"
  "@effect/platform-node": "4.1.5"
  "@simplewebauthn/server": "14.1.0"
  "@types/node": "26.6.11"
  "@types/react": "19.3.3"
  "@types/react-dom": "19.3.0"
  effect: "4.1.5"
  ox: "1.9.0"
  react: "19.3.1"
  react-dom: "19.3.1"
  tailwindcss: "4.3.5"
  typescript: "7.0.2"
  viem: "2.58.7"

engineStrict: true
# Exact versions when adding dependencies; published libraries write their ranges by hand.
savePrefix: ""
# Scripts refuse to run on an install that no longer matches the lockfile.
verifyDepsBeforeRun: error

# A release must be a day old before it installs, so a compromised version is likely caught first.
minimumReleaseAge: 1440
# Effect ships the language service, test helpers and runtime together, and @effect-kit republishes
# Effect's repository tools with provenance: take their releases at once. Namera is our own SDK, released
# alongside bluechip.
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@effect-kit/*"
  - "@namera-ai/*"

# Security fixes for transitive dependencies (Dependabot), each within its parent's major: prool pins tar
# 7.2.0, rehype-katex wants KaTeX 0.16 and typeid-js and Bull an older uuid.
overrides:
  tar: 7.5.23
  katex: 0.19.1
  "typeid-js>uuid": 11.1.1
  "bull>uuid": 11.1.1

# Dependency install scripts are denied unless listed as true.
allowBuilds:
  "@depot/cli": false
  # posthog-js pulls core-js, whose script only prints a funding message.
  core-js: false
  dprint: false
  esbuild: false
  lefthook: true
  # Alto's optional native accelerators; both fall back to JavaScript.
  msgpackr-extract: false
  protobufjs: false

# Alto's ERC-7562 tracer, fixed to run on Anvil and to allow the P-256 precompile (as Namera's devnet does).
patchedDependencies:
  "@pimlico/alto@0.0.21": patches/@pimlico__alto@0.0.21.patch
