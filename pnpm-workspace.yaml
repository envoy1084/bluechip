packages:
  - apps/*
  - packages/*
  - scratchpad
  - scripts

# Versions referenced by more than one package.json. A dependency only one package uses is pinned
# in that package.json instead.
catalog:
  "@effect/platform-node": "4.1.5"
  "@types/node": "26.6.6"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  effect: "4.1.5"
  react: "19.3.1"
  react-dom: "19.3.1"
  tailwindcss: "4.3.5"
  viem: "2.58.6"

engineStrict: true
# Exact versions when adding dependencies; published libraries write their ranges by hand.
savePrefix: ""
# Scripts refuse to run on an install that no longer matches the lockfile.
verifyDepsBeforeRun: error

# A release must be a day old before it installs, so a compromised version is likely caught first.
minimumReleaseAge: 1440
# Effect ships the language service, test helpers and runtime together, and @effect-kit republishes
# Effect's repository tools with provenance: take their releases at once. Namera is our own SDK, released
# alongside bluechip.
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@effect-kit/*"
  - "@namera-ai/*"

# Dependency install scripts are denied unless listed as true.
allowBuilds:
  dprint: false
  esbuild: false
  lefthook: true
