# Local development services. `docker compose up -d` starts Postgres; `docker compose --profile chain up -d` also
# starts a local Base: an Anvil fork of Base mainnet (real stocks, pools, feeds, USDC and Namera contracts, fake
# money) and Alto, an ERC-4337 bundler, in front of it.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bluechip
      POSTGRES_PASSWORD: bluechip
      POSTGRES_DB: bluechip
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluechip -d bluechip"]
      interval: 2s
      timeout: 2s
      retries: 30

  anvil:
    profiles: [chain]
    image: ghcr.io/foundry-rs/foundry:v1.9.0@sha256:3a392c18f9b16e665e932de159fb6fa9ed972c4b4352f2f76a1a8c7ca9b57d39
    entrypoint: ["sh", "-c"]
    # Chain id stays 8453, so addresses, signatures and Namera's compatibility checks match mainnet. A pinned
    # BASE_FORK_BLOCK is cached in the volume, so restarts at that block cost no RPC.
    command:
      - >-
        exec anvil --host 0.0.0.0 --port 8545 --chain-id 8453 --block-time 2
        --fork-url "$${BASE_FORK_RPC_URL}" $${BASE_FORK_BLOCK:+--fork-block-number $$BASE_FORK_BLOCK}
    environment:
      BASE_FORK_RPC_URL: ${BASE_FORK_RPC_URL:-https://mainnet.base.org}
      BASE_FORK_BLOCK: ${BASE_FORK_BLOCK:-}
    ports:
      - "8545:8545"
    volumes:
      - foundry-cache:/home/foundry/.foundry/cache
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 60

  alto:
    profiles: [chain]
    image: ghcr.io/pimlicolabs/alto:latest@sha256:f2661042aadefc6a4fc9c5826a14404f574c7ef2de76bdf83fe6a0829137b3c5
    depends_on:
      anvil:
        condition: service_healthy
    # The executor and utility keys are Anvil's public test accounts 1 and 0: they hold fork ETH only.
    command:
      - --rpc-url=http://anvil:8545
      - --entrypoints=0x0000000071727De22E5E9d8BAf0edAc6f37da032
      - --executor-private-keys=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      - --utility-private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - --chain-type=op-stack
      - --safe-mode=false
      - --port=4337
    ports:
      - "4337:4337"

volumes:
  postgres: {}
  foundry-cache: {}
