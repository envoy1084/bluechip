# bluechip on Dokploy, in Compose mode (deploy/README.md): the web app (Caddy, static pages only) and the server, each
# on its own domain (the browser calls the server's directly), with an optional Postgres. Paper and production are two
# Dokploy projects deploying this same file with their own environment, which Dokploy writes to `.env` beside it: the
# server reads all of it, the web build takes its VITE_* values as build args. Set `COMPOSE_PROFILES=postgres` to run
# the bundled Postgres (pgvector).
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        VITE_NETWORK: ${VITE_NETWORK:?set VITE_NETWORK to sepolia (paper) or base (production)}
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL to the server's domain (https://paper-api.bluechip.markets)}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_POSTHOG_PROJECT_API_KEY: ${VITE_POSTHOG_PROJECT_API_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_DEPLOYMENT_ENVIRONMENT: ${VITE_DEPLOYMENT_ENVIRONMENT:-}
    restart: unless-stopped
    # Static pages only: it never reaches the server. Attach the site's domain to this service on port 80 in
    # Dokploy's Domains tab; Dokploy adds Traefik's labels and its network.
    expose:
      - "80"

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      # The server's own public origin (the Telegram webhook's), the one the web build calls.
      API_ORIGIN: ${VITE_API_URL:?set VITE_API_URL to the server's domain (https://paper-api.bluechip.markets)}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # SIGTERM, then 2 s for open requests and live streams, then the engine's shutdown.
    stop_grace_period: 20s
    # Attach the API's domain (api.bluechip.markets) to this service on port 8080 in Dokploy's Domains tab; no
    # published port.
    expose:
      - "8080"
    networks:
      - internal

  postgres:
    profiles: [postgres]
    # Postgres 18 with pgvector, as compose.yaml at the root (the `vector` extension is created by a migration).
    image: pgvector/pgvector:0.8.1-pg18-trixie@sha256:2fd905ba95f99a51be207d0ff0b8d5b8538cbce7e9083b3ccfa65b93bb28b938
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluechip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-bluechip}
    volumes:
      - postgres:/var/lib/postgresql
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

networks:
  internal: {}

volumes:
  postgres: {}
